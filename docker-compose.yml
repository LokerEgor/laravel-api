services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    image: php:8.4-fpm
    container_name: app
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:9.6.0
    container_name: db
    platform: linux/x86_64
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: