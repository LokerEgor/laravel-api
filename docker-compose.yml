services:
  app:
    image: php:8.5-cli
    container_name: laravel_app
    ports:
      - "8080:8000"
    volumes:
      - ./api:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:9.6.0
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"